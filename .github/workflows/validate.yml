name: Validate infrastructure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: infra-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pinned validation tools
        run: >-
          python3 -m pip install --disable-pip-version-check
          ansible-core==2.19.12 yamllint==1.38.0

      - name: Validate repository
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Test atomic graph publisher
        run: make check-graph-refresh
