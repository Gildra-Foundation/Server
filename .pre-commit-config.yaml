minimum_pre_commit_version: "4.6.0"

repos:
  - repo: local
    hooks:
      - id: diff-check
        name: git diff --check
        entry: git diff --check
        language: system
        pass_filenames: false
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.(yml|yaml)$
        pass_filenames: false
      - id: make-check
        name: make check (manual)
        entry: make check
        language: system
        pass_filenames: false
        stages: [manual]
