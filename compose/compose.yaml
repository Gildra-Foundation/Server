name: ${COMPOSE_PROJECT_NAME:-gildra}

services:
  postgres:
    image: "${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: gildra_app
      POSTGRES_USER: gildra_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app_internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 4g
    cpus: 1.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m

  clickhouse:
    image: "${CLICKHOUSE_IMAGE:?CLICKHOUSE_IMAGE is required}"
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: gildra_analytics
      CLICKHOUSE_USER: gildra_app
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    secrets:
      - clickhouse_password
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    networks:
      - app_internal
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8123/ping | grep -q Ok
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 6g
    cpus: 1.5
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    stop_grace_period: 2m

  redis:
    image: "${REDIS_IMAGE:?REDIS_IMAGE is required}"
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lfu
    volumes:
      - redis_data:/data
    networks:
      - app_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

networks:
  app_internal:
    internal: true

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  redis_data:

secrets:
  postgres_password:
    file: "${POSTGRES_PASSWORD_FILE:?POSTGRES_PASSWORD_FILE is required}"
  clickhouse_password:
    file: "${CLICKHOUSE_PASSWORD_FILE:?CLICKHOUSE_PASSWORD_FILE is required}"
